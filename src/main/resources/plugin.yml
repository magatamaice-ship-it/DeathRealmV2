name: DeathRealmV2
version: 2.0.0
main: id.deathrealm.DeathRealm
api-version: '1.21'
author: DeathRealm
description: Advanced death dimension and resurrection system

softdepend:
  - ProtocolLib

commands:
  lahirkankembali:
    description: Melahirkan kembali pemain secara instan
    usage: /lahirkankembali <nama_player>
    permission: deathrealm.admin

permissions:
  deathrealm.admin:
    description: Mengizinkan penggunaan perintah kelahiran kembali
    default: op
